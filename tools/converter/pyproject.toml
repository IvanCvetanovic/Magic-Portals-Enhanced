[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ethanon2godot"
version = "0.1.0"
description = "Parses Ethanon Engine scene/entity files and emits Godot 4 .tscn scenes"
readme = "README.md"
# 3.11.9 is what is installed on the dev machine; 3.11 gives us tomllib + typing niceties.
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ivan Cvetanovic" }]

# Deliberately ZERO runtime dependencies. Ethanon's on-disk formats are plain
# text/JSON and Godot's .tscn is plain text — the stdlib covers both. Adding a
# dependency should require a reason written down in DEVLOG.md.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
ethanon2godot = "ethanon2godot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
